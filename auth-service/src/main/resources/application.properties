spring.application.name=auth-service

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:auth_user}
spring.datasource.password=${DB_PASSWORD:auth_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# --- Login lockout ---
auth.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
auth.lockout-duration-minutes=${LOCKOUT_DURATION_MINUTES:15}

# --- OTP ---
auth.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
